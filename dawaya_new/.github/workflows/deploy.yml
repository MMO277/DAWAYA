name: Deploy DAWAYA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-Unpack ZIP
        run: |
          for z in DAWAYA-Platform-Full-Implementation.zip dawaya.zip; do
            if [ -f "$z" ]; then
              unzip -o -q "$z" -d . -x ".github/*"
              rm -f "$z" package-lock.json
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              git reset -- .github/workflows || true
              git commit -m "chore: unpack DAWAYA files into repo" || true
              git push origin HEAD:main || true
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: rm -f package-lock.json && npm install
      - run: npm run build
        env:
          VITE_AI_PROXY_BASE_URL: ${{ secrets.VITE_AI_PROXY_BASE_URL || vars.VITE_AI_PROXY_BASE_URL || 'https://us-central1-dawaya-343f8.cloudfunctions.net/dawayaAiProxy' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
