name: Fetch All DAWAYA Drug Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_all_drug_images.py'
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect real product image URLs across 26,597+ items
        run: python3 scripts/fetch_all_drug_images.py

      - name: Commit and push updated image map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dawaya_drug_images.json
          git diff --staged --quiet || (git commit -m "chore: auto-enrich real product image URLs" && git push)
