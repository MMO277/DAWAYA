name: Sync Egyptian Market Drug Prices
on:
  schedule:
    # Runs automatically every day at 02:00 UTC (04:00 AM Cairo Time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      price_feed_url:
        description: 'رابط ملف تحديث الأسعار (CSV أو JSON أو رابط Google Sheet منشور بصيغة CSV)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Price Synchronization Engine
        env:
          PRICE_FEED_URL: ${{ github.event.inputs.price_feed_url || vars.PRICE_FEED_URL || '' }}
        run: |
          python3 scripts/sync_market_prices.py

      - name: Commit & Push Updated Prices (If Changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/dawaya_live_price_deltas.json public/data/dawaya_medicines_search_index.json public/data/chunks/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(prices): automated Egyptian market drug price sync"
            git push origin HEAD:main
          else
            echo "No price changes detected in this sync cycle."
          fi
